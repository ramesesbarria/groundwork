# Sample PR workflow for a project using Groundwork. Copy to .github/workflows/.
#
# The head job checks the real PR head. The merge job runs tests on the simulated merge result.
# Do not run the freshness/context check on the merge ref: that ref contains main, so the ancestry
# check would pass even when the PR head is behind.
name: Groundwork PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  head:
    name: groundwork-head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      # Pin this to the version your project uses. Add it as a devDependency and use
      # `npx --no-install groundwork-ai` if you want a fully locked install.
      - run: npx --yes groundwork-ai@0.9.0 check --base origin/main

  merge:
    name: groundwork-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm test
